name: CI/CD

# Когда запускать пайплайн
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------
  # Job 1: проверка Python-кода (линтинг + синтаксис)
  # ---------------------------------------------------------------
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flake8

      - name: Run flake8
        run: |
          # E501 (длина строки) и E203 отключены — не критично для учебного проекта
          flake8 app.py --max-line-length=120 --extend-ignore=E203

  # ---------------------------------------------------------------
  # Job 2: сборка Docker-образа — проверяем, что Dockerfile рабочий.
  # Публикация в registry происходит только для пушей в main (не для PR).
  # ---------------------------------------------------------------
  docker-build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: lint  # запускается только если lint прошёл успешно

    # Права, нужные именно для публикации в GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логинимся в ghcr.io только если будем реально пушить образ
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Формируем теги: latest + короткий hash коммита
      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          # push=true только при пуше в main, для pull request просто собираем и проверяем
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


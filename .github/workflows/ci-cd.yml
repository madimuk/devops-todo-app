name: CI/CD

# Когда запускать пайплайн
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------
  # Job 1: проверка Python-кода (линтинг + синтаксис)
  # ---------------------------------------------------------------
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flake8

      - name: Run flake8
        run: |
          # E501 (длина строки) и E203 отключены — не критично для учебного проекта
          flake8 app.py --max-line-length=120 --extend-ignore=E203

  # ---------------------------------------------------------------
  # Job 2: сборка → сканирование Trivy → публикация.
  # Публикация в registry только для пушей в main и только если скан чистый.
  # ---------------------------------------------------------------
  docker-build-and-push:
    name: Build, scan and push Docker image
    runs-on: ubuntu-latest
    needs: lint  # запускается только если lint прошёл успешно

    # Права, нужные именно для публикации в GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Логинимся в ghcr.io только если будем реально пушить образ
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Формируем теги: latest + короткий hash коммита
      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Дата для сброса кэша apt-слоя раз в сутки
      - name: Get build date
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 1) Собираем образ локально в раннер (load: true), НЕ публикуя его —
      #    сначала его нужно просканировать
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: todo-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APT_CACHE_BUST=${{ steps.date.outputs.day }}

      # 2) Сканируем образ Trivy. При HIGH/CRITICAL с готовым исправлением
      #    шаг падает (exit-code 1) — и уязвимый образ не попадёт в registry.
      #    Action подключён по SHA коммита, а не по тегу: в марте 2026 теги
      #    trivy-action были перезаписаны вредоносным кодом (CVE-2026-33634).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: todo-app:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # 3) Публикуем в ghcr.io только просканированный образ и только при push в main.
      #    Слои берутся из кэша шага 1, поэтому повторная сборка занимает секунды.
      - name: Push image to registry
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            APT_CACHE_BUST=${{ steps.date.outputs.day }}

  # ---------------------------------------------------------------
  # Job 3: terraform plan в AWS без постоянных ключей.
  # GitHub выдаёт короткоживущий OIDC-токен, AWS STS меняет его
  # на временные креды роли github-actions-devops-todo-plan (read-only).
  # ---------------------------------------------------------------
  terraform-plan:
    name: Terraform plan (OIDC → AWS)
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read
      id-token: write  # без этого GitHub не выдаст OIDC-токен

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # По SHA, как и trivy-action: этот action получает доступ к AWS
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Who am I in AWS
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      # aws_key_pair читает .pub через file() — на раннере его нет,
      # создаём одноразовый ключ только для plan
      - name: Create throwaway SSH key
        run: mkdir -p ~/.ssh && ssh-keygen -t ed25519 -N "" -q -f ~/.ssh/aws-devops-todo

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color

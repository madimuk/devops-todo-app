name: CI

# Когда запускать пайплайн
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # Job 1: проверка Python-кода (линтинг + синтаксис)
  # ---------------------------------------------------------------
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flake8

      - name: Run flake8
        run: |
          # E501 (длина строки) и E203 отключены — не критично для учебного проекта
          flake8 app.py --max-line-length=120 --extend-ignore=E203

  # ---------------------------------------------------------------
  # Job 2: сборка Docker-образа — проверяем, что Dockerfile рабочий
  # ---------------------------------------------------------------
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint  # запускается только если lint прошёл успешно

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: devops-todo-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Dependabot: автоматические pull request'ы на обновление зависимостей.
# Документация: https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  # GitHub Actions в .github/workflows/ — в том числе trivy-action,
  # закреплённый по SHA: Dependabot обновит и SHA, и комментарий с версией
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]          # все обновления actions — одним PR
    commit-message:
      prefix: "ci"

  # Python-пакеты из requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Базовый образ в Dockerfile (python:3.12-slim)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"

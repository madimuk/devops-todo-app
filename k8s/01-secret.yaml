# Secret хранит чувствительные данные (пароли, ключи) отдельно от остального кода.
# Значения кодируются в base64 (это НЕ шифрование, просто кодировка —
# для настоящего продакшена используют что-то вроде AWS Secrets Manager или Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: devops-todo-app
type: Opaque
stringData:
  # stringData позволяет писать значения обычным текстом —
  # Kubernetes сам закодирует их в base64 при сохранении
  POSTGRES_DB: tododb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  namespace: devops-todo-app
spec:
  ingressClassName: nginx
  rules:
    - host: todo-app.local  # Локальное "доменное имя" — понадобится добавить в /etc/hosts
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-app  # Ссылается на тот же Service, что уже существует
                port:
                  number: 5000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devops-todo-app
spec:
  replicas: 1  # У базы данных, в отличие от приложения, обычно только 1 копия —
               # масштабирование БД устроено сложнее, чем масштабирование stateless-приложений
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# PersistentVolumeClaim — "запрос" на постоянное хранилище,
# чтобы данные БД не терялись при перезапуске Pod'а
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: devops-todo-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-todo-app
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: devops-todo-app
spec:
  replicas: 2  # Две копии приложения — вот она, суть Kubernetes:
               # если одна упадёт, вторая продолжит обслуживать запросы
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          # Используем уже готовый образ из GitHub Container Registry —
          # тот самый, что собирает наш CI/CD-пайплайн
          image: ghcr.io/madimuk/devops-todo-app:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: "postgres"  # Имя Service постгреса — Kubernetes DNS резолвит его сам
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: postgres-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: devops-todo-app
spec:
  type: NodePort  # Для локального minikube — доступ снаружи кластера через порт ноды
  selector:
    app: todo-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500  # Диапазон NodePort в Kubernetes: 30000-32767
